name: Bump site version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: site-version
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ github.actor != 'github-actions[bot]' && github.event.head_commit != null && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump VERSION and visible labels
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          BUMP=patch
          case "$COMMIT_MESSAGE" in
            *"[major]"*) BUMP=major ;;
            *"[minor]"*) BUMP=minor ;;
          esac
          node scripts/bump-version.mjs "$BUMP"
          VERSION=$(cat VERSION)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION index.html guqin/index.html
          git commit -m "chore: bump site version to v$VERSION [skip ci]"
          git push
